apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: { app: emqx }
  template:
    metadata:
      labels: { app: emqx }
    spec:
      containers:
        - name: emqx
          image: emqx/emqx:5.8
          ports:
            - containerPort: 1883    # MQTT
            - containerPort: 18083   # dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
spec:
  selector: { app: emqx }
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-ext
spec:
  type: NodePort
  selector: { app: emqx }
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31883
    - name: dashboard
      port: 18083
      targetPort: 18083
      nodePort: 31083
